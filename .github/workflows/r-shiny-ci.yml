
name: R Shiny CI

on:
  push:
  pull_request:

jobs:
  smoke-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install R dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::shiny
            any::ggplot2

      - name: Verify dependencies
        run: Rscript -e 'stopifnot(requireNamespace("shiny", quietly = TRUE), requireNamespace("ggplot2", quietly = TRUE))'

      - name: Test WILDROOT AI
        run: Rscript tests/smoke_test.
